services:
  # База данных PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: agora_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is required} -d ${DB_NAME:?DB_NAME is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agora_network

  frontend:
    env_file:
      - .env
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - /app/node_modules
      - /app/.nuxt
    environment:
      - NODE_ENV=development
      # Адрес backend внутри Docker-сети. Используется только серверным прокси Nuxt.
      - BACKEND_URL=http://backend:6080
      # Polling для Vite watcher (virtiofs не пробрасывает inotify через Colima VM)
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    # docker compose watch синхронизирует файлы через docker cp, минуя virtiofs
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules
            - .nuxt
            - .output
            - dist
        - action: rebuild
          path: ./frontend/package.json
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - agora_network

  backend:
    env_file:
      - shared.env
      - .env
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "6080:6080"
    volumes:
      # - ./backend:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    environment:
      - RUST_LOG=info
      - RUSTFLAGS=-C link-arg=-fuse-ld=mold
      - DATABASE_URL=postgresql://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:?DB_NAME is required}
    command: sh -c "find /app/src -name '*.rs' | xargs touch && cargo watch -x run"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agora_network

  minio:
    image: minio/minio
    container_name: agora_minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - agora_network

  minio-init:
    image: minio/mc
    container_name: agora_minio_init
    env_file:
      - shared.env
      - .env
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"); do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb myminio/\"$${MINIO_BUCKET_AVATARS}\" || true;
      /usr/bin/mc anonymous set download myminio/\"$${MINIO_BUCKET_AVATARS}\" || /usr/bin/mc policy set download myminio/\"$${MINIO_BUCKET_AVATARS}\" || true;
      /usr/bin/mc mb myminio/\"$${MINIO_BUCKET_WIKI_MEDIA}\" || true;
      /usr/bin/mc anonymous set download myminio/\"$${MINIO_BUCKET_WIKI_MEDIA}\" || /usr/bin/mc policy set download myminio/\"$${MINIO_BUCKET_WIKI_MEDIA}\" || true;
      /usr/bin/mc mb myminio/\"$${MINIO_BUCKET_CHAT_FILES}\" || true;
      exit 0;
      "
    depends_on:
      - minio
    networks:
      - agora_network

volumes:
  cargo_cache:
    name: agora_cargo_cache
  target_cache:
    name: agora_target_cache
  postgres_data:
    name: agora_postgres_data
  minio_data:
    name: agora_minio_data

networks:
  agora_network:
    driver: bridge